services:
  - type: web
    name: class-workspace
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: AUTH_ENABLED
        value: "false"
      - key: BASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
